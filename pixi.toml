[workspace]
name = "age-detection"
version = "0.1.0"
description = "Stima dell'età da immagini con YuNet (OpenCV) + ViT/SigLIP (Hugging Face)"
channels = ["conda-forge"]
platforms = [{ name = "my-linux-64", platform = "linux-64", cuda = "12" }]


[dependencies]
python = ">=3.11,<3.14"
libblas = { version = "*", build = "*openblas" }
numpy = "*"
pillow = "*"
opencv = ">=4.10"
pytorch-gpu = ">=2.4"
torchvision = "*"
transformers = ">=4.45"
huggingface_hub = "*"
safetensors = "*"
tqdm = "*"

[tasks]
# esempi: pixi run detect foto.jpg  |  pixi run crops cartella_crop/
detect = "python src/age_detect.py"
crops = "python src/age_detect.py --crops"
